services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /code/appdata
    ports:
      # Local-only by default. Access using an SSH tunnel or an HTTPS reverse proxy.
      - "192.168.1.130:8124:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - building_brain_data:/code/appdata
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  building_brain_data:
