<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Share · Building Brain</title><style>body{background:#101317;color:#eef2f4;font:16px system-ui;margin:0;padding:24px}main{max-width:420px;margin:5vh auto}label{display:block;margin:18px 0 5px}input,textarea,button{font:inherit;box-sizing:border-box;width:100%;padding:14px;border-radius:8px;border:1px solid #46515b;background:#1c2228;color:white}button{margin-top:18px;background:#ffb44e;color:#161616;font-weight:700}button:disabled{opacity:.5}img{max-width:100%;max-height:360px} [hidden]{display:none!important}</style></head><body><main><small>BUILDING BRAIN / CONNECT</small><h1>Quick Share</h1><p>Snap a photo. Send it to management. No work order needed.</p><form id="login"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form><form id="share" hidden><label>Take or choose a photo<input name="photo" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" required></label><img id="preview" hidden alt="Selected photo"><label>Caption (optional)<textarea name="caption" maxlength="1000"></textarea></label><button>Send photo</button><button type="button" id="logout">Sign out</button></form><p id="status" role="status"></p></main><script src="/static/quick-share.js" defer></script></body></html>
