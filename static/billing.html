<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Building Brain Billing</title><style>body{font:16px system-ui;background:#101827;color:#eef2ff;margin:0;padding:2rem}main{max-width:1000px;margin:auto}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}article{background:#202c40;padding:1.5rem;border-radius:12px}button,select{font:inherit;padding:.7rem;border-radius:6px}button{cursor:pointer}a{color:#a5c9ff}button:disabled{cursor:not-allowed;opacity:.5}</style></head><body><main><a href="/">← Dashboard</a><h1>Building Brain subscriptions</h1><p id="status" role="status">Loading billing status…</p><label>Billing interval <select id="interval"><option value="monthly">Monthly</option><option value="annual">Annual (two months free)</option></select></label><section id="plans"></section><p><button id="portal" disabled>Manage subscription</button></p><p>Private workspace pilot. Public company registration and plan limits are not yet available.</p></main><script>
const statusEl=document.getElementById('status'), plans=document.getElementById('plans'), interval=document.getElementById('interval'), portal=document.getElementById('portal');
let state;
async function api(path,body){const r=await fetch('/api/billing/'+path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(typeof j.detail==='string'?j.detail:'Billing request failed');return j}
function render(){plans.replaceChildren();for(const [name,prices] of Object.entries(state.plans)){const card=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p'),b=document.createElement('button');h.textContent=name[0].toUpperCase()+name.slice(1);p.textContent='$'+prices[interval.value==='annual'?1:0]+'/'+(interval.value==='annual'?'year':'month');b.textContent='Subscribe';b.disabled=!state.enabled||state.subscriptions.some(s=>!['canceled','incomplete_expired'].includes(s.status));b.onclick=()=>go('checkout',{plan:name,interval:interval.value});card.append(h,p,b);plans.append(card)}portal.disabled=!state.enabled||!state.has_customer}
async function go(path,body){try{document.querySelectorAll('button').forEach(b=>b.disabled=true);location.assign((await api(path,body)).url)}catch(e){statusEl.textContent=e.message;render()}}
interval.onchange=()=>{if(state)render()};portal.onclick=()=>go('portal',{});
api('status').then(s=>{state=s;statusEl.textContent=!s.enabled?'Billing pilot disabled':s.subscriptions.map(x=>x.plan+' — '+x.status).join(', ')||'No subscription';render()}).catch(e=>statusEl.textContent=e.message);
</script></body></html>
