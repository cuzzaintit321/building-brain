<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Building Brain accounts</title><main><h1>Create company account</h1><form id="register"><label>Company <input name="name" required></label><label>Email <input name="email" type="email" required></label><button type="button" data-send="verification">Email verification code</button><label>Code <input name="token" required></label><label>Password <input name="password" type="password" minlength="12" required></label><button>Create account</button></form><h2>Reset password</h2><form id="reset"><label>Email <input name="email" type="email" required></label><button type="button" data-send="recovery">Email recovery code</button><label>Code <input name="token" required></label><label>New password <input name="password" type="password" minlength="12" required></label><button>Reset password</button></form><p id="status" role="status"></p><a href="/tenant-login">Sign in</a></main><script>const statusEl=document.getElementById('status');async function post(path,body){const r=await fetch('/api/accounts/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error('Request unsuccessful');return r.json()}for(const b of document.querySelectorAll('[data-send]'))b.onclick=async()=>{try{await post(b.dataset.send,{email:b.form.email.value});statusEl.textContent='If eligible, check your email.'}catch(e){statusEl.textContent=e.message}};for(const f of document.forms)f.onsubmit=async e=>{e.preventDefault();try{const j=await post(f.id,Object.fromEntries(new FormData(f)));statusEl.textContent=j.organization_id?'Save your organization ID: '+j.organization_id:'Password updated.'}catch(e){statusEl.textContent=e.message}};</script></html>
