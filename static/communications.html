<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect · Building Brain</title><style>body{background:#101317;color:#eee;font:16px system-ui;margin:0;padding:20px}main{max-width:760px;margin:auto}input,select,button{font:inherit;padding:12px;background:#252b31;color:white;border:1px solid #56616d;border-radius:6px}button{background:#ffb44e;color:#141414;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}label{display:block;margin:12px 0}input,select{max-width:100%;box-sizing:border-box}#messages{height:220px;overflow:auto;background:#1b2025;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}video{background:#090b0c;width:48%;max-height:340px} [hidden]{display:none!important}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}</style></head><body><main><small>BUILDING BRAIN / CONNECT</small><h1>Communications</h1><form id="login"><label>Username <input name="username" required autocomplete="username"></label><label>Password <input name="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form><section id="workspace" hidden><p id="identity"></p><label>Contact <select id="contact"></select></label><div class="actions"><button id="voice">Voice call</button><button id="video">Video call</button><button id="logout">Sign out</button><a href="/static/quick-share.html" style="color:#ffb44e">Quick Share</a></div><div id="messages" aria-live="polite"></div><form id="compose" class="actions"><input name="body" maxlength="4000" required placeholder="Write a message"><button>Send</button></form><section id="call" hidden><h2 id="call-status"></h2><div class="actions"><button id="accept" hidden>Accept</button><button id="decline" hidden>Decline</button><button id="hangup">End call</button><button id="mute">Mute</button><button id="camera">Camera off</button><button id="flip">Switch camera</button></div><video id="remote" autoplay playsinline></video><video id="local" autoplay playsinline muted></video></section></section><p id="status" role="status"></p></main><script src="/static/communications.js" defer></script></body></html>
