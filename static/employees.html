<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Building Brain employees</title><body><main><a href="/">Dashboard</a><h1>Employees</h1><p id="status" role="status"></p><ul id="employees"></ul><h2>Invite employee</h2><form id="invite"><input name="email" type="email" required placeholder="Email"><select name="role"><option>member</option><option>admin</option><option>viewer</option></select><button>Generate invitation</button></form><p>Share invitation tokens privately with the intended recipient. They expire after 24 hours.</p><output id="token"></output></main><script>
const statusEl=document.getElementById('status');
async function api(path,method='GET',body){const r=await fetch('/api/tenant/'+path,{method,headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(typeof j.detail==='string'?j.detail:'Request failed');return j}
async function load(){try{const list=document.getElementById('employees');list.replaceChildren();for(const e of await api('employees')){const li=document.createElement('li');li.textContent=e.email+' — '+e.role+' ';if(e.role!=='owner'){const select=document.createElement('select');for(const role of ['admin','member','viewer'])select.add(new Option(role,role));select.value=e.role;select.onchange=async()=>{try{await api('employees/'+e.id,'PUT',{role:select.value});await load()}catch(err){statusEl.textContent=err.message}};const remove=document.createElement('button');remove.textContent='Remove';remove.onclick=async()=>{if(confirm('Remove employee access?'))try{await api('employees/'+e.id,'DELETE');await load()}catch(err){statusEl.textContent=err.message}};li.append(select,remove)}list.append(li)}}catch(e){statusEl.textContent=e.message}}
document.getElementById('invite').onsubmit=async e=>{e.preventDefault();try{const j=await api('invitations','POST',Object.fromEntries(new FormData(e.target)));document.getElementById('token').textContent=j.token}catch(err){statusEl.textContent=err.message}};load();
</script></body></html>
