<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Building Brain company login</title></head><body><main><h1>Company sign in</h1><form id="login"><p><label>Email <input name="email" type="email" required autocomplete="username"></label></p><p><label>Password <input name="password" type="password" required autocomplete="current-password"></label></p><p><label>Organization ID <input name="organization_id" required maxlength="32"></label></p><button>Sign in</button></form><p id="status" role="status"></p></main><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();const status=document.getElementById('status');try{const r=await fetch('/api/tenant/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});if(!r.ok)throw Error('Sign in failed');location.assign('/')}catch(e){status.textContent=e.message}};</script></body></html>
